<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hajszaki AI Chat Widget</title>
  <style>
    :root{
      --bg:#020617;         /* slate-950 */
      --panel:#0b1220;      /* deep */
      --panel2:#111827;     /* slate-900 */
      --line:#1f2937;       /* slate-800 */
      --text:#e5e7eb;       /* gray-200 */
      --muted:#9ca3af;      /* gray-400 */
      --gold:#eab308;       /* amber-500 */
      --gold2:#facc15;      /* amber-400 */
      --shadow: 0 16px 40px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      background: transparent;
      height:100vh;
      overflow:hidden;
    }

    /* Bubble */
    #hs-bubble{
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 999999;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold2), var(--gold));
      color: #111827;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,.45);
      user-select:none;
    }
    #hs-bubble .dot{
      width:10px;height:10px;border-radius:999px;
      background:#111827;
      opacity:.9;
    }
    #hs-bubble:hover{filter:brightness(1.02)}

    /* Panel */
    #hs-panel{
      position: fixed;
      right: 20px;
      bottom: 78px;
      width: 360px;
      max-width: calc(100vw - 40px);
      height: 520px;
      max-height: calc(100vh - 120px);
      background: linear-gradient(180deg, var(--panel), var(--bg));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:none;
      z-index: 999999;
    }
    .hs-header{
      background: rgba(17,24,39,.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
    }
    .hs-brand{
      display:flex; gap:10px; align-items:center;
      min-width:0;
    }
    .hs-logo{
      width:36px;height:36px;border-radius:12px;
      background: radial-gradient(circle at 30% 30%, var(--gold2), var(--gold));
      display:grid;place-items:center;
      color:#111827;
      font-weight:900;
      box-shadow: 0 10px 24px rgba(234,179,8,.25);
    }
    .hs-title{
      min-width:0;
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .hs-title b{color:var(--text); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .hs-title span{color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .hs-actions{
      display:flex; gap:8px; align-items:center;
    }
    .hs-btn{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(2,6,23,.35);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 12px;
      cursor:pointer;
      font-size: 12px;
    }
    .hs-btn:hover{border-color: rgba(234,179,8,.55)}
    .hs-close{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(2,6,23,.35);
      color: var(--text);
      cursor:pointer;
    }
    .hs-close:hover{border-color: rgba(234,179,8,.55)}

    /* Messages */
    #hs-messages{
      padding: 14px 12px;
      height: calc(100% - 120px);
      overflow:auto;
    }
    .hs-msg{
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 14px;
      margin: 0 0 10px 0;
      font-size: 13px;
      line-height: 1.35;
      border: 1px solid rgba(255,255,255,.08);
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .hs-bot{
      background: rgba(17,24,39,.65);
      color: var(--text);
      margin-right:auto;
      border-top-left-radius: 6px;
    }
    .hs-user{
      background: rgba(234,179,8,.95);
      color: #111827;
      margin-left:auto;
      border-top-right-radius: 6px;
    }
    .hs-tip{
      color: var(--muted);
      font-size: 11px;
      margin: -2px 0 12px 2px;
    }

    /* Composer */
    .hs-compose{
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 10px;
      display:flex;
      gap:8px;
      align-items:center;
      background: rgba(2,6,23,.45);
      backdrop-filter: blur(10px);
    }
    #hs-input{
      flex:1;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(2,6,23,.35);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      outline:none;
      font-size: 13px;
    }
    #hs-input:focus{border-color: rgba(234,179,8,.65)}
    #hs-send{
      border: none;
      background: linear-gradient(180deg, var(--gold2), var(--gold));
      color: #111827;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 13px;
      box-shadow: 0 10px 24px rgba(234,179,8,.18);
    }
    #hs-send:hover{filter:brightness(1.03)}
  </style>
</head>
<body>

  <!-- Bubble -->
  <div id="hs-bubble" aria-label="Chat megnyitása">
    <div class="dot"></div>
    <div>Hajszaki AI</div>
  </div>

  <!-- Panel -->
  <div id="hs-panel" role="dialog" aria-label="Hajszaki AI chat">
    <div class="hs-header">
      <div class="hs-brand">
        <div class="hs-logo">✂️</div>
        <div class="hs-title">
          <b>Hajszaki Barber AI</b>
          <span>Árak • időpont • helyszín • tippek</span>
        </div>
      </div>
      <div class="hs-actions">
        <button class="hs-btn" id="hs-reset">Új chat</button>
        <div class="hs-close" id="hs-close" title="Bezárás">✕</div>
      </div>
    </div>

    <div id="hs-messages">
      <div class="hs-msg hs-bot">Szia tesó! 😎✂️ Itt a Hajszaki AI. Kérdezz bátran árakról, időtartamról, címről, foglalásról.</div>
      <div class="hs-tip">Pro tipp: „Mennyi idő egy haj+szakáll?”</div>
    </div>

    <div class="hs-compose">
      <input id="hs-input" type="text" placeholder="Írj egy kérdést…" autocomplete="off" />
      <button id="hs-send">Küld</button>
    </div>
  </div>

  <script>
    // ====== BEÁLLÍTÁSOK ======
    // Ha később AI-ra kötjük: ide jön egy webhook URL (Make.com) vagy saját backend endpoint.
    // Most üresen hagyjuk, és DEMÓ válaszokat adunk.
    const AI_ENDPOINT_URL = ""; // pl. "https://hook.eu1.make.com/xxxxx"

    const bubble = document.getElementById("hs-bubble");
    const panel  = document.getElementById("hs-panel");
    const closeBtn = document.getElementById("hs-close");
    const resetBtn = document.getElementById("hs-reset");
    const messages = document.getElementById("hs-messages");
    const input = document.getElementById("hs-input");
    const sendBtn = document.getElementById("hs-send");

    function addMsg(text, who){
      const div = document.createElement("div");
      div.className = "hs-msg " + (who === "user" ? "hs-user" : "hs-bot");
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function demoAnswer(userText){
      const t = userText.toLowerCase();
      if (t.includes("mennyi") && (t.includes("idő") || t.includes("ido") || t.includes("perc"))) {
        return "Hajvágás kb. 40–50 perc, haj+szakáll általában 45–60 perc. 👌";
      }
      if (t.includes("ár") || t.includes("ar") || t.includes("mennyibe") || t.includes("ft")) {
        return "Haj + szakáll: 8000 Ft. Ha csak haj, azt is meg tudjuk beszélni foglalásnál. 😄";
      }
      if (t.includes("hol") || t.includes("cím") || t.includes("cim") || t.includes("parkol")) {
        return "Sárvár, Kis utca 25. Parkolás általában az utcán megoldható. 📍";
      }
      if (t.includes("időpont") || t.includes("foglal") || t.includes("calendly")) {
        return "Időpontot a weboldalon tudsz foglalni pár kattintással. Ha elküldöd, melyik nap jó, segítek eligazodni. 📅";
      }
      return "Vágom, tesó 😎 Írj még egy kicsit pontosabban (ár / idő / cím / foglalás), és mondom!";
    }

    async function callAI(userText){
      // 1) Ha van endpoint, küldjük oda
      if (AI_ENDPOINT_URL) {
        try {
          const res = await fetch(AI_ENDPOINT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userText })
          });
          const data = await res.json().catch(() => ({}));
          // Várjuk, hogy { reply: "..." } formában jöjjön vissza
          if (data && data.reply) return String(data.reply);
          return "Most valamiért nem tudtam választ kérni az AI-tól. Próbáld újra egy picit később. 🙏";
        } catch (e) {
          return "Hopp, valami hálózati gubanc van. Próbáld újra! 🙏";
        }
      }

      // 2) Nincs endpoint → demo válasz
      return demoAnswer(userText);
    }

    async function send(){
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg(text, "user");

      addMsg("…", "bot");
      const lastBot = messages.lastElementChild;

      const reply = await callAI(text);
      lastBot.textContent = reply;
    }

    bubble.addEventListener("click", () => {
      panel.style.display = "block";
      input.focus();
    });
    closeBtn.addEventListener("click", () => {
      panel.style.display = "none";
    });
    resetBtn.addEventListener("click", () => {
      // törlünk mindent a tip kivételével
      messages.innerHTML = `
        <div class="hs-msg hs-bot">Szia tesó! 😎✂️ Itt a Hajszaki AI. Kérdezz bátran árakról, időtartamról, címről, foglalásról.</div>
        <div class="hs-tip">Pro tipp: „Mennyi idő egy haj+szakáll?”</div>
      `;
      input.focus();
    });

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
